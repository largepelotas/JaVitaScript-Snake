name: Release Vita build

# Tag a commit `v1.0.0` (etc.) and push the tag to build snake.vpk against
# VitaSDK and attach it to a GitHub Release, so players can install without
# building from source.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # VERSION is what the binary logs at startup and what CMakeLists.txt derives
  # param.sfo's XX.YY from, but nothing stops a tag being pushed that disagrees
  # with it - and a .vpk stamped with the wrong version is not something a
  # player can notice or a release can be corrected for. So this fails the
  # release before the build runs.
  #
  # Its own job on a plain runner: bash is guaranteed, and a mismatch costs a
  # few seconds instead of a VitaSDK container pull.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag and VERSION agree
        shell: bash
        env:
          # Via env, not ${{ }} inline: a tag name is attacker-chosen text and
          # has no business being pasted into a shell script.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The grammar CMakeLists.txt applies to VERSION, with a leading v.
          # Leading zeros are rejected so "v01.2.3" cannot mean two things.
          num='(0|[1-9][0-9]*)'
          if [[ ! $TAG =~ ^v$num\.$num\.$num$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH (e.g. v1.1.1)"
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}

          # Checked here as well as in CMakeLists.txt, so the release fails in
          # seconds rather than after the container pull.
          if (( major > 99 || minor > 99 )); then
            echo "::error::param.sfo holds two digits per field, so v$major.$minor.x cannot be expressed"
            exit 1
          fi

          if [[ ! -f VERSION ]]; then
            echo "::error::no VERSION file at the repository root"
            exit 1
          fi
          version=$(tr -d '[:space:]' < VERSION)

          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::tag $TAG was pushed, but VERSION says $version"
            exit 1
          fi
          printf '%s -> VERSION %s, param.sfo APP_VER %02d.%02d\n' \
                 "$TAG" "$version" "$major" "$minor"

  build-vita:
    needs: check-version
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 packages via vdpm
        run: |
          vdpm sdl2
          vdpm sdl2_ttf

      - name: Configure
        run: cmake -B build-vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake

      - name: Build
        run: cmake --build build-vita

      - uses: actions/upload-artifact@v4
        with:
          name: snake-vpk
          path: build-vita/snake.vpk

  release:
    needs: build-vita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snake-vpk

      - uses: softprops/action-gh-release@v2
        with:
          files: snake.vpk
          generate_release_notes: true
