name: Release Vita build

# Tag a commit `v1.0.0` (etc.) and push the tag to build snake.vpk against
# VitaSDK and attach it to a GitHub Release, so players can install without
# building from source.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The version lives in two places that cannot hold the same string: the tag
  # is vMAJOR.MINOR.PATCH, and param.sfo takes only XX.YY, so CMakeLists.txt
  # carries a truncated copy. Nothing keeps them in step, and a .vpk stamped
  # with the wrong version is not something a player can notice or a release
  # can be corrected for. So this fails the release before the build runs.
  #
  # Its own job on a plain runner: bash is guaranteed, and a mismatch costs a
  # few seconds instead of a VitaSDK container pull.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag and VITA_VERSION agree
        shell: bash
        env:
          # Via env, not ${{ }} inline: a tag name is attacker-chosen text and
          # has no business being pasted into a shell script.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! $TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH (e.g. v1.1.0)"
            exit 1
          fi
          # 10# forces base 10: printf %d reads a leading-zero field as octal
          # and dies on 08 and 09.
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))

          if (( major > 99 || minor > 99 )); then
            echo "::error::param.sfo holds two digits per field, so v$major.$minor.x cannot be expressed"
            exit 1
          fi
          expected=$(printf '%02d.%02d' "$major" "$minor")

          actual=$(sed -n 's/^[[:space:]]*set(VITA_VERSION[[:space:]]*"\([^"]*\)").*/\1/p' CMakeLists.txt)
          if [[ -z $actual ]]; then
            echo "::error::no set(VITA_VERSION \"...\") found in CMakeLists.txt"
            exit 1
          fi
          if [[ $(wc -l <<<"$actual") -ne 1 ]]; then
            echo "::error::CMakeLists.txt sets VITA_VERSION more than once:"
            echo "$actual"
            exit 1
          fi

          if [[ $actual != "$expected" ]]; then
            echo "::error::tag $TAG wants VITA_VERSION \"$expected\", CMakeLists.txt has \"$actual\""
            exit 1
          fi
          echo "$TAG -> VITA_VERSION \"$actual\", as expected."

  build-vita:
    needs: check-version
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 packages via vdpm
        run: |
          vdpm sdl2
          vdpm sdl2_ttf

      - name: Configure
        run: cmake -B build-vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake

      - name: Build
        run: cmake --build build-vita

      - uses: actions/upload-artifact@v4
        with:
          name: snake-vpk
          path: build-vita/snake.vpk

  release:
    needs: build-vita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snake-vpk

      - uses: softprops/action-gh-release@v2
        with:
          files: snake.vpk
          generate_release_notes: true
